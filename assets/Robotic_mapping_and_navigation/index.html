<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ROS2-Based Robotic Navigation and Mapping</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f3f0e8;
            --panel: #ffffff;
            --panel-alt: #eef4f3;
            --text: #1f2933;
            --muted: #52616a;
            --accent: #0b6b7a;
            --accent-dark: #084d58;
            --border: #d8dfdd;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Montserrat, Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(11, 107, 122, 0.14), transparent 30%),
                radial-gradient(circle at bottom right, rgba(36, 52, 59, 0.12), transparent 28%),
                var(--bg);
            line-height: 1.6;
        }

        main {
            max-width: 1180px;
            margin: 0 auto;
            padding: 40px 20px 56px;
        }

        .hero {
            display: grid;
            gap: 18px;
            margin-bottom: 28px;
            padding: 28px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.86);
            backdrop-filter: blur(10px);
            box-shadow: 0 24px 60px rgba(36, 52, 59, 0.08);
        }

        .eyebrow {
            margin: 0;
            color: var(--accent);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.6px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 3.5rem);
            line-height: 1.1;
        }

        .hero p {
            margin: 0;
            max-width: 70ch;
            color: var(--muted);
            font-size: 1.02rem;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 4px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 11px 16px;
            border-radius: 999px;
            border: 1px solid transparent;
            text-decoration: none;
            font-weight: 800;
            transition: transform 0.18s ease, background-color 0.18s ease, color 0.18s ease;
        }

        .button:hover,
        .button:focus {
            transform: translateY(-1px);
        }

        .button.primary {
            color: #ffffff;
            background: var(--accent);
        }

        .button.primary:hover,
        .button.primary:focus {
            background: var(--accent-dark);
        }

        .button.secondary {
            color: var(--accent);
            background: rgba(255, 255, 255, 0.74);
            border-color: var(--border);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .video-card {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--panel);
            box-shadow: 0 18px 40px rgba(36, 52, 59, 0.07);
        }

        .video-card:nth-child(2) {
            background: linear-gradient(180deg, var(--panel), var(--panel-alt));
        }

        .video-meta {
            padding: 18px 20px 14px;
        }

        .video-meta h2 {
            margin: 0 0 8px;
            font-size: 1.2rem;
        }

        .video-meta p {
            margin: 0;
            color: var(--muted);
            font-size: 0.96rem;
        }

        video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #111827;
        }

        @media (max-width: 900px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            main {
                padding: 18px 12px 34px;
            }

            .hero {
                padding: 20px;
                border-radius: 16px;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="hero">
            <p class="eyebrow">Robotics and Control Systems</p>
            <h1>ROS2-Based Robotic Navigation and Mapping</h1>
        
            <div class="actions">
                <a class="button primary" href="../../index.html">Back to Portfolio</a>
            </div>
        </section>

        <section id="videos" class="video-grid" aria-label="Robotic navigation and mapping videos">
            <article class="video-card">
                <div class="video-meta">
                    <h2>Merge Visualization Trailexclusion</h2>
                    <p>GLIM-based mapping output focused on merged visualization behavior.</p>
                </div>
                <video controls preload="metadata">
                    <source src="Merge_visualization_trailexclusion.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </article>

            <article class="video-card">
                <div class="video-meta">
                    <h2>Visualization Centroid Closeup</h2>
                    <p>Close-up view of the centroid visualization in the mapping workflow.</p>
                </div>
                <video controls preload="metadata">
                    <source src="visualization_centroid_closeup.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </article>
        </section>
    </main>
</body>
</html>
